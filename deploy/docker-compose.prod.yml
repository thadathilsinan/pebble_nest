# Production, on a single VPS. Not run by hand: `deploy/deploy.sh` copies the
# repository to the server and runs this file there, as
#
#   docker compose -f /opt/pebble/app/deploy/docker-compose.prod.yml \
#     --env-file /opt/pebble/.env up -d --build --wait
#
# The images are built on the server, from the committed source, so there is no
# registry and no cross-architecture build.
#
# `/opt/pebble/.env` holds every secret and lives outside `app/`, which each
# deploy replaces. Its template is `deploy/production.env.example`.

# Fixed, because the directory this file sits in is replaced on every deploy and
# the containers and volumes must still be recognised as the same project.
name: pebble

# Docker keeps every line a container writes, forever, unless told otherwise.
# Three 10 MB files per container is the ceiling here.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  # The database is Neon, not a container here: DATABASE_URL in
  # /opt/pebble/.env points at it.

  # Runs to completion on every deploy, before `api` is replaced. The deploy
  # script is the only thing that runs it, one deploy at a time.
  migrate:
    build:
      context: ..
      target: migrate
    env_file: ../../.env
    logging: *logging

  api:
    build:
      context: ..
      target: runtime
    restart: unless-stopped
    env_file: ../../.env
    logging: *logging
    depends_on:
      migrate:
        condition: service_completed_successfully
    # No `ports`: Traefik is the only way in, at https://pebble.moduluz.io.
    # Traefik runs separately on the VPS (its own compose file, with
    # `network_mode: host`, entrypoints `web`/`websecure` and the `letsencrypt`
    # resolver), finds this container through these labels, and reaches it on
    # its IP in this project's default network, so no shared network is needed.
    #
    # `trust proxy` is 1 in `configure-app.ts`, which matches this single hop.
    # Traefik does not trust forwarded headers by default, so it replaces any
    # X-Forwarded-For a client sends with the real client address, and the rate
    # limits key on that.
    labels:
      - traefik.enable=true
      - traefik.http.routers.pebble.rule=Host(`pebble.moduluz.io`)
      - traefik.http.routers.pebble.entrypoints=websecure
      - traefik.http.routers.pebble.tls.certresolver=letsencrypt
      - traefik.http.services.pebble.loadbalancer.server.port=3000
